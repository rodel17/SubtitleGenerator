services:

  # Laravel PHP-FPM app
  app:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Horizon: runs and supervises the Redis queue workers (dashboard at http://localhost:8000/horizon)
  # Workers keep code in memory — after changing job code run: docker compose restart horizon
  horizon:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_horizon
    # Same user as PHP-FPM, so both can read and delete the files the other creates
    user: www-data
    command: php artisan horizon
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis
      - whisper

  # Laravel scheduler (routes/console.php): horizon:snapshot for dashboard metrics, model:prune
  scheduler:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_scheduler
    user: www-data
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Nginx serving Laravel (reverse proxy to PHP-FPM)
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      # Host-only: on the server the public reaches Laravel through caddy (HTTPS)
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # Vue frontend (Vite dev server w/ hot reload)
  frontend:
    build:
      context: .
      dockerfile: Docker/node/Dockerfile
      target: dev
    container_name: vue_frontend
    volumes:
      - ./frontend:/app
      # Container-only node_modules (Linux binaries), kept in sync by docker-entrypoint.sh
      - /app/node_modules
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-} # Vite only answers requests for this host name besides localhost
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app-network

  # HTTPS in front of the app on the server: Let's Encrypt certificates, fetched and renewed by Caddy.
  # Only starts with COMPOSE_PROFILES=production (root .env on the server, see .env.example), never locally.
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    profiles: [production]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates; losing them means asking Let's Encrypt again (rate-limited)
      - caddy_config:/config
    depends_on:
      - nginx
      - frontend
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"  # host 5433: a native PostgreSQL 9.5 on Windows already uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Speech-to-text (faster-whisper). Called by the TranscribeAudio job at http://whisper:9000.
  # First start downloads the model into the whisper_models volume.
  # Bigger ASR_MODEL (small, medium) = more accurate but slower on CPU.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    container_name: laravel_whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
      ASR_MODEL_PATH: /data/whisper
    volumes:
      - whisper_models:/data/whisper
    networks:
      - app-network

  # Redis: queues (via Horizon) and cache
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  whisper_models:
  caddy_data:
  caddy_config: