services:

  # Laravel PHP-FPM app
  app:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Horizon: runs and supervises the Redis queue workers (dashboard at http://localhost:8000/horizon)
  # Workers keep code in memory — after changing job code run: docker compose restart horizon
  horizon:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_horizon
    command: php artisan horizon
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Laravel scheduler (routes/console.php): horizon:snapshot for dashboard metrics, model:prune
  scheduler:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: laravel_scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Nginx serving Laravel (reverse proxy to PHP-FPM)
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # Vue frontend (Vite dev server w/ hot reload)
  frontend:
    build:
      context: .
      dockerfile: Docker/node/Dockerfile
      target: dev
    container_name: vue_frontend
    volumes:
      - ./frontend:/app
      # Container-only node_modules (Linux binaries), kept in sync by docker-entrypoint.sh
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"  # host 5433: a native PostgreSQL 9.5 on Windows already uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis: queues (via Horizon) and cache
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: