name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# Never on main: a cancelled run could stop halfway through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same PHP version and extensions as Docker/php/Dockerfile.
      # Tests use in-memory SQLite (phpunit.xml), so no Postgres service is needed.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, redis, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Tests (Pest)
        run: php artisan test --compact

  frontend:
    name: Frontend (lint, type-check, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Run linters directly: the npm "lint" scripts use --fix, which would hide errors in CI.
      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only
        env:
          VITE_API_URL: http://localhost:8000/api

  # Deploys main to the EC2 server once both test jobs pass.
  # GitHub signs in to AWS as the `github-deploy` IAM user (access key in repo secrets;
  # the AWS Free plan doesn't allow OIDC identity providers) and AWS Systems Manager
  # runs Docker/deploy.sh on the instance, so SSH stays closed to GitHub's runners.
  # One-time AWS/GitHub setup: see "CD" in PROGRESS.md.
  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One deploy at a time; a newer one waits instead of cancelling the running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: /home/ubuntu/SubtitleGenerator
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true # the repo is public, and so are its Actions logs

      - name: Check the server is reachable
        run: |
          ping=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          if [ "$ping" != "Online" ]; then
            echo "::error::Instance $INSTANCE_ID isn't online in Systems Manager (status: $ping). Is it stopped?"
            exit 1
          fi

      - name: Deploy (git merge + Docker/deploy.sh on the server)
        run: |
          # Runs as root through SSM; the deploy itself runs as ubuntu, which owns the checkout.
          # flock queues a deploy behind one that is still running on the server.
          # Merging this run's exact commit (fast-forward only) deploys what CI tested,
          # and fails loudly if someone changed tracked files on the server.
          script="cd $APP_DIR && exec runuser -u ubuntu -- env HOME=/home/ubuntu flock /tmp/subtitle-deploy.lock \
            bash -c 'git fetch --quiet origin main && git merge --ff-only $GITHUB_SHA && bash Docker/deploy.sh'"
          params=$(jq -nc --arg script "$script" '{commands: [$script], executionTimeout: ["1800"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 60 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          status=Pending
          while [ "$status" = Pending ] || [ "$status" = InProgress ] || [ "$status" = Delayed ]; do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)
            echo "… $status"
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$status" != Success ]; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            echo "::error::Deploy finished with status $status"
            exit 1
          fi
