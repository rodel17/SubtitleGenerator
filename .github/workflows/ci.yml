name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# Never on main: a cancelled run could stop halfway through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same PHP version and extensions as Docker/php/Dockerfile.
      # Tests use in-memory SQLite (phpunit.xml), so no Postgres service is needed.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, redis, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Tests (Pest)
        run: php artisan test --compact

  frontend:
    name: Frontend (lint, type-check, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Run linters directly: the npm "lint" scripts use --fix, which would hide errors in CI.
      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only
        env:
          VITE_API_URL: http://localhost:8000/api

  # Deploys main to the Oracle server once both test jobs pass.
  # GitHub connects over SSH with a key that may only run Docker/remote-deploy.sh (a forced
  # command in ~/.ssh/authorized_keys on the server), which merges this run's commit and runs
  # Docker/deploy.sh. One-time server/GitHub setup: see "CD on Oracle" in PROGRESS.md.
  deploy:
    name: Deploy to Oracle
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One deploy at a time; a newer one waits instead of cancelling the running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Set up the deploy key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::error::Set the ORACLE_SSH_KEY and ORACLE_KNOWN_HOSTS secrets and the ORACLE_HOST variable"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's own key, pinned: the deploy only talks to the real server
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (git merge + Docker/deploy.sh on the server)
        env:
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          # The server ignores any other command for this key; the output streams into this log
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "ubuntu@$HOST" "deploy $GITHUB_SHA"
